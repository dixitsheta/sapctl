# Continue.dev MCP integration
#
# Drop into ~/.continue/config.yaml under `mcpServers:` (Continue >= 0.9.x).
# For older Continue (<0.9), use the deprecated config.json with the same
# structure under mcpServers and command/args fields.

mcpServers:
  - name: sapctl
    command: /usr/local/bin/sapctl
    args:
      - mcp
      - serve
    env:
      HOME: ${HOME}
      XDG_CONFIG_HOME: ${HOME}/.config
      PATH: /usr/local/bin:/usr/bin:/bin
